<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StormWatch</title>
<meta name="theme-color" content="#0D1B2A">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
<style>
  :root{
    --storm-dark:#0D1B2A;
    --storm-blue:#1B263B;
    --storm-accent:#4CC9F0;
    --storm-warning:#F94144;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
  body{
    background:linear-gradient(160deg,var(--storm-dark),var(--storm-blue) 60%,#26415e);
    color:#fff; overflow-x:hidden; min-height:100vh;
    display:flex; flex-direction:column;
  }
  [dir="rtl"] body{ direction:rtl; }

  .storm-bg{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;}

  /* --- Nubes en varias capas de profundidad (parallax): las lejanas más tenues/lentas, las cercanas más grandes/rápidas --- */
  .cloud{position:absolute; border-radius:50%; will-change:transform;}
  .cloud.layer-far{background:rgba(255,255,255,0.045); filter:blur(10px);}
  .cloud.layer-mid{background:rgba(255,255,255,0.075); filter:blur(7px);}
  .cloud.layer-near{background:rgba(255,255,255,0.11); filter:blur(4px);}

  .cloud.c1{width:380px;height:130px; top:6%;  left:-25%; animation:drift 22s linear infinite, sway 5s ease-in-out infinite;}
  .cloud.c2{width:300px;height:110px; top:16%; left:-45%; animation:drift 16s linear infinite, sway 4s ease-in-out infinite; animation-delay:-4s,-1s;}
  .cloud.c3{width:460px;height:160px; top:33%; left:-35%; animation:drift 27s linear infinite, sway 6s ease-in-out infinite; animation-delay:-12s,-2s;}
  .cloud.c4{width:240px;height:95px;  top:48%; left:-30%; animation:drift 13s linear infinite, sway 3.5s ease-in-out infinite; animation-delay:-3s,-1s;}
  .cloud.c5{width:340px;height:120px; top:60%; left:-40%; animation:drift 19s linear infinite, sway 4.5s ease-in-out infinite; animation-delay:-7s,-2s;}
  .cloud.c6{width:220px;height:85px;  top:75%; left:-20%; animation:drift 11s linear infinite, sway 3s ease-in-out infinite; animation-delay:-2s,-1s;}

  @keyframes drift{ from{transform:translateX(0);} to{transform:translateX(160vw);} }
  @keyframes sway{ 0%,100%{margin-top:0;} 50%{margin-top:14px;} }

  /* --- Modo tormenta: el cielo se oscurece y las nubes se ven más densas/amenazantes --- */
  .storm-bg::before{content:""; position:absolute; inset:0; background:rgba(2,8,15,0); transition:background 1.4s ease; z-index:1; pointer-events:none;}
  .storm-bg.storm-mode::before{background:rgba(2,8,15,.45);}
  .storm-bg.storm-mode .cloud.layer-far{background:rgba(180,195,210,0.09);}
  .storm-bg.storm-mode .cloud.layer-mid{background:rgba(170,185,205,0.16);}
  .storm-bg.storm-mode .cloud.layer-near{background:rgba(150,165,190,0.22);}
  .storm-bg.storm-mode .cloud{ transition:background 1.4s ease; }
  .cloud{ transition:background 1.4s ease; }

  /* --- Relámpago: destello breve que se dispara por JS cuando hay tormenta activa --- */
  .lightning-flash{position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:2;}
  .lightning-flash.flash{animation:flash 0.5s ease-out;}
  @keyframes flash{
    0%{opacity:0;} 8%{opacity:.55;} 16%{opacity:.05;} 24%{opacity:.4;} 40%{opacity:0;} 100%{opacity:0;}
  }

  /* --- Lluvia: gotas individuales generadas por JS, cada una con su propia velocidad/inclinación --- */
  .rain{position:absolute; inset:-5% -5%; opacity:0; transition:opacity .8s; transform:rotate(8deg); z-index:2;}
  .rain.active{opacity:.8;}
  .drop{position:absolute; top:-10%; width:1.5px; height:60px; background:linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,.55)); animation:fall linear infinite;}
  @keyframes fall{ to{ transform:translateY(120vh); } }

  main{position:relative; z-index:1; flex:1; display:flex; flex-direction:column; padding:20px; padding-top:max(20px, env(safe-area-inset-top)); padding-bottom:90px; max-width:480px; margin:0 auto; width:100%;}

  .topbar{display:flex; justify-content:flex-end; gap:6px; margin-bottom:14px;}
  .icon-btn{background:none;border:none;color:#fff;font-size:22px;padding:8px;cursor:pointer;opacity:.9;}
  .icon-btn:active{opacity:.5;}

  .glass{
    background:linear-gradient(180deg, rgba(255,255,255,.20), rgba(255,255,255,.07));
    border:1px solid rgba(255,255,255,.35);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-radius:22px; padding:18px 20px; margin-bottom:14px;
  }
  .city{font-size:18px; font-weight:600; margin:0 0 2px;}
  .temp{font-size:44px; font-weight:700; margin:0; line-height:1;}
  .desc{font-size:14px; opacity:.9; margin:6px 0 2px; text-transform:capitalize;}
  .feels{font-size:12px; opacity:.7;}
  .stats-row{display:flex; justify-content:space-between; text-align:center;}
  .stat b{display:block; font-size:16px;}
  .stat span{font-size:11px; opacity:.7;}

  .forecast-row{display:flex; justify-content:space-between; gap:6px;}
  .forecast-day{display:flex; flex-direction:column; align-items:center; gap:4px; flex:1;}
  .forecast-day .fc-label{font-size:12px; font-weight:600; text-transform:capitalize;}
  .forecast-day .fc-pop{font-size:11px; color:var(--storm-accent);}
  .forecast-day .fc-temp{font-size:12px; opacity:.85;}
  .alert-row{display:flex; align-items:center; gap:10px;}
  .alert-row .dot{width:10px;height:10px;border-radius:50%;background:var(--storm-warning); flex-shrink:0; box-shadow:0 0 10px var(--storm-warning);}
  .muted{opacity:.75; font-size:13px;}

  button.primary{
    background:var(--storm-accent); color:#04202b; border:none; border-radius:14px;
    padding:12px 20px; font-size:15px; font-weight:600; cursor:pointer; width:100%;
  }
  button.primary:active{opacity:.85;}
  .loader{width:18px;height:18px;border:2px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:spin .8s linear infinite; display:inline-block; vertical-align:middle; margin-inline-end:10px;}
  @keyframes spin{ to{ transform:rotate(360deg);} }

  .sheet-overlay{position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:10; display:none; align-items:flex-end;}
  .sheet-overlay.open{display:flex;}
  .sheet{background:var(--storm-blue); width:100%; max-height:88vh; overflow-y:auto; border-radius:24px 24px 0 0; padding:20px; padding-bottom:max(24px, env(safe-area-inset-bottom)); position:relative;}
  .sheet h2{margin-top:0; font-size:19px;}
  .lang-option{display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid rgba(255,255,255,.08); cursor:pointer;}
  .lang-option input{width:18px;height:18px;}
  .row-between{display:flex; justify-content:space-between; align-items:center; padding:12px 0; gap:12px; flex-wrap:wrap;}
  .row-label{display:flex; align-items:center; gap:8px; flex:1 1 auto; min-width:0;}
  .switch{position:relative; width:46px; height:26px; flex-shrink:0;}
  .switch input{opacity:0; width:0; height:0;}
  .slider{position:absolute; inset:0; background:rgba(255,255,255,.25); border-radius:20px; transition:.2s; cursor:pointer;}
  .slider:before{content:"";position:absolute; height:20px;width:20px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s;}
  .switch input:checked + .slider{background:var(--storm-accent);}
  .switch input:checked + .slider:before{transform:translateX(20px);}
  [dir="rtl"] .switch input:checked + .slider:before{transform:translateX(-20px);}
  .link-btn{background:none;border:none;color:var(--storm-accent);font-size:15px;padding:10px 0;text-align:start;cursor:pointer;}
  .apikey-input{width:100%; padding:10px 12px; border-radius:10px; border:1px solid rgba(255,255,255,.3); background:rgba(255,255,255,.08); color:#fff; font-size:14px; margin-top:6px;}
  .apikey-input::placeholder{color:rgba(255,255,255,.5);}
  .close-x{position:absolute; top:14px; inset-inline-end:16px; background:none;border:none;color:#fff;font-size:20px;cursor:pointer;}

  .bottom-banner{
    position:fixed; bottom:0; left:0; right:0; z-index:5;
    background:rgba(13,27,42,.9); backdrop-filter:blur(10px);
    color:rgba(255,255,255,.55); text-align:center; font-size:11px;
    padding:10px; border-top:1px solid rgba(255,255,255,.1);
  }

  /* --- Pantalla de radar de lluvia en directo --- */
  .radar-overlay{position:fixed; inset:0; z-index:20; background:var(--storm-dark); display:none; flex-direction:column;}
  .radar-overlay.open{display:flex;}
  .radar-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px; padding-top:max(14px, env(safe-area-inset-top));
    font-weight:600; font-size:15px; background:var(--storm-blue);
    border-bottom:1px solid rgba(255,255,255,.1);
  }
  #radarMap{flex:1; width:100%; background:#0a141f;}
  .radar-legend{padding:8px 14px; padding-bottom:max(8px, env(safe-area-inset-bottom)); text-align:center; font-size:11px; background:var(--storm-blue);}
  /* El popup/atribución de Leaflet no encaja con el tema oscuro por defecto: lo adaptamos */
  .leaflet-control-attribution{background:rgba(13,27,42,.75)!important; color:rgba(255,255,255,.6)!important; font-size:9px!important;}
  .leaflet-control-attribution a{color:rgba(255,255,255,.8)!important;}
  .leaflet-control-zoom a{background:rgba(27,38,59,.9)!important; color:#fff!important; border-color:rgba(255,255,255,.15)!important;}
</style>
</head>
<body>

<div class="storm-bg" id="stormBg">
  <div class="cloud c3 layer-far"></div>
  <div class="cloud c5 layer-far"></div>
  <div class="cloud c1 layer-mid"></div>
  <div class="cloud c4 layer-mid"></div>
  <div class="cloud c2 layer-near"></div>
  <div class="cloud c6 layer-near"></div>
  <div class="rain" id="rainLayer"></div>
  <div class="lightning-flash" id="lightningFlash"></div>
</div>

<main>
  <div class="topbar">
    <button class="icon-btn" id="btnRadar" aria-label="radar" data-i18n-title="radar_button">📡</button>
    <button class="icon-btn" id="btnSettings" aria-label="settings">⚙️</button>
  </div>
  <div id="content"></div>
</main>

<div class="bottom-banner" data-i18n="ad_banner_placeholder">Espacio reservado para banner publicitario (AdMob / AdSense)</div>

<div class="sheet-overlay" id="settingsOverlay">
  <div class="sheet">
    <button class="close-x" id="closeSettings">✕</button>
    <h2 data-i18n="settings_title">Ajustes</h2>
    <div id="langList"></div>
    <div class="row-between">
      <span class="row-label">
        <img src="bell-icon.png" alt="" style="width:22px;height:22px;border-radius:5px;flex-shrink:0;">
        <span data-i18n="settings_notifications">Notificaciones de alerta de tormenta</span>
      </span>
      <label class="switch">
        <input type="checkbox" id="notifToggle">
        <span class="slider"></span>
      </label>
    </div>
    <div style="display:none;">
      <input class="apikey-input" id="apiKeyInput">
    </div>
    <button class="link-btn" id="btnPrivacy" data-i18n="settings_privacy_policy">Política de privacidad</button>
  </div>
</div>

<div class="sheet-overlay" id="privacyOverlay">
  <div class="sheet">
    <button class="close-x" id="closePrivacy">✕</button>
    <h2 data-i18n="privacy_policy_title">Política de privacidad</h2>
    <p class="muted" data-i18n="privacy_policy_body" style="line-height:1.6;"></p>
  </div>
</div>

<div class="radar-overlay" id="radarOverlay">
  <div class="radar-header">
    <span data-i18n="radar_title">Radar de lluvia en directo</span>
    <button class="close-x" id="closeRadar" style="position:static;">✕</button>
  </div>
  <div id="radarMap"></div>
  <div class="radar-legend muted" data-i18n="radar_legend">Datos de precipitación casi en tiempo real · OpenWeatherMap</div>
</div>

<script>
const I18N = {
  es: { dir:"ltr",
    settings_title:"Ajustes", settings_notifications:"Notificaciones de alerta de tormenta",
    settings_privacy_policy:"Política de privacidad", settings_apikey_label:"Clave de OpenWeatherMap (gratuita)",
    loading_weather:"Obteniendo el clima local…", feels_like:"Sensación térmica",
    humidity:"Humedad", wind:"Viento", rain_chance:"Probabilidad de lluvia",
    no_active_alerts:"No hay alertas de tormenta activas por ahora",
    alert_storm_incoming:"Aviso de tormenta: se espera lluvia intensa pronto en tu zona",
    retry:"Reintentar", error_generic:"No pudimos cargar el clima. Comprueba tu conexión y tu clave de API.",
    location_permission_title:"Activa el clima local",
    location_permission_body:"StormWatch necesita tu ubicación para mostrar el clima preciso y avisarte antes de que lleguen las tormentas.",
    location_permission_grant:"Permitir acceso a la ubicación",
    need_apikey:"Añade tu clave gratuita de OpenWeatherMap en Ajustes ⚙️ para ver el clima real.",
    ad_banner_placeholder:"Espacio reservado para banner publicitario (AdMob / AdSense)",
    privacy_policy_title:"Política de privacidad",
    privacy_policy_body:"StormWatch recopila únicamente tu ubicación aproximada o precisa, usada localmente en tu dispositivo para obtener datos meteorológicos de OpenWeatherMap. No vendemos tus datos personales. Servicios de terceros: OpenWeatherMap (datos meteorológicos). Puedes revocar el permiso de ubicación en cualquier momento desde los ajustes de tu navegador.",
    radar_title:"Radar de lluvia en directo", radar_legend:"Datos de precipitación casi en tiempo real · OpenWeatherMap",
    radar_needs_location:"Activa la ubicación primero para centrar el radar en tu zona.",
    forecast_days:"Próximos días"
  },
  en: { dir:"ltr",
    settings_title:"Settings", settings_notifications:"Storm alert notifications",
    settings_privacy_policy:"Privacy Policy", settings_apikey_label:"OpenWeatherMap key (free)",
    loading_weather:"Fetching local weather…", feels_like:"Feels like",
    humidity:"Humidity", wind:"Wind", rain_chance:"Chance of rain",
    no_active_alerts:"No active storm alerts right now",
    alert_storm_incoming:"Storm warning: heavy rain expected soon in your area",
    retry:"Retry", error_generic:"We couldn't load the weather. Check your connection and API key.",
    location_permission_title:"Enable local weather",
    location_permission_body:"StormWatch needs your location to show accurate weather and warn you before storms arrive.",
    location_permission_grant:"Allow location access",
    need_apikey:"Add your free OpenWeatherMap key in Settings ⚙️ to see real weather.",
    ad_banner_placeholder:"Reserved space for banner ad (AdMob / AdSense)",
    privacy_policy_title:"Privacy Policy",
    privacy_policy_body:"StormWatch only collects your approximate or precise location, used locally on your device to fetch weather data from OpenWeatherMap. We do not sell your personal data. Third-party services: OpenWeatherMap (weather data). You can revoke location access anytime from your browser settings.",
    radar_title:"Live rain radar", radar_legend:"Near real-time precipitation data · OpenWeatherMap",
    radar_needs_location:"Enable location first so we can center the radar on your area.",
    forecast_days:"Coming days"
  },
  ar: { dir:"rtl",
    settings_title:"الإعدادات", settings_notifications:"إشعارات تنبيه العواصف",
    settings_privacy_policy:"سياسة الخصوصية", settings_apikey_label:"مفتاح OpenWeatherMap (مجاني)",
    loading_weather:"جارٍ جلب الطقس المحلي…", feels_like:"الشعور الحراري",
    humidity:"الرطوبة", wind:"الرياح", rain_chance:"احتمال هطول الأمطار",
    no_active_alerts:"لا توجد تنبيهات عواصف نشطة حاليًا",
    alert_storm_incoming:"تحذير عاصفة: يُتوقع هطول أمطار غزيرة قريبًا في منطقتك",
    retry:"إعادة المحاولة", error_generic:"تعذّر تحميل بيانات الطقس. تحقق من اتصالك ومفتاح API.",
    location_permission_title:"فعّل الطقس المحلي",
    location_permission_body:"يحتاج StormWatch إلى موقعك لعرض الطقس بدقة وتنبيهك قبل وصول العواصف.",
    location_permission_grant:"السماح بالوصول إلى الموقع",
    need_apikey:"أضف مفتاح OpenWeatherMap المجاني في الإعدادات ⚙️ لرؤية الطقس الحقيقي.",
    ad_banner_placeholder:"مساحة محجوزة لإعلان بانر (AdMob / AdSense)",
    privacy_policy_title:"سياسة الخصوصية",
    privacy_policy_body:"يجمع StormWatch فقط موقعك التقريبي أو الدقيق، ويُستخدم محليًا على جهازك لجلب بيانات الطقس من OpenWeatherMap. نحن لا نبيع بياناتك الشخصية. الخدمات الخارجية: OpenWeatherMap (بيانات الطقس). يمكنك إلغاء إذن الموقع في أي وقت من إعدادات متصفحك.",
    radar_title:"رادار الأمطار المباشر", radar_legend:"بيانات هطول الأمطار شبه الفورية · OpenWeatherMap",
    radar_needs_location:"فعّل الموقع أولًا لتوسيط الرادار على منطقتك.",
    forecast_days:"الأيام القادمة"
  },
  zh: { dir:"ltr",
    settings_title:"设置", settings_notifications:"风暴预警通知",
    settings_privacy_policy:"隐私政策", settings_apikey_label:"OpenWeatherMap 密钥（免费）",
    loading_weather:"正在获取本地天气…", feels_like:"体感温度",
    humidity:"湿度", wind:"风速", rain_chance:"降雨概率",
    no_active_alerts:"目前没有正在生效的风暴预警",
    alert_storm_incoming:"风暴预警：您所在地区即将出现强降雨",
    retry:"重试", error_generic:"无法加载天气信息，请检查网络连接和 API 密钥。",
    location_permission_title:"启用本地天气",
    location_permission_body:"StormWatch 需要获取您的位置信息，以显示准确的天气并在风暴来临前提醒您。",
    location_permission_grant:"允许访问位置信息",
    need_apikey:"请在设置 ⚙️ 中添加您的免费 OpenWeatherMap 密钥以查看真实天气。",
    ad_banner_placeholder:"广告横幅预留位置（AdMob / AdSense）",
    privacy_policy_title:"隐私政策",
    privacy_policy_body:"StormWatch 仅收集您设备的大致或精确位置信息，并在本地用于从 OpenWeatherMap 获取天气数据。我们不会出售您的个人数据。第三方服务：OpenWeatherMap（天气数据）。您可以随时在浏览器设置中撤销位置权限。",
    radar_title:"实时降雨雷达", radar_legend:"近实时降水数据 · OpenWeatherMap",
    radar_needs_location:"请先启用定位，以便将雷达对准您所在的区域。",
    forecast_days:"未来几天"
  }
};
const SUPPORTED = ["es","en","ar","zh"];

const state = {
  lang: localStorage.getItem("sw_lang") || detectSystemLang(),
  notif: localStorage.getItem("sw_notif") !== "0",
  apiKey: localStorage.getItem("sw_apikey") || "b68c6f16b36d906532b8e3b77a3d8d33",
  weather: null,
  loading: true,
  error: null,
  needsLocation: false
};

function detectSystemLang(){
  const nav = (navigator.language || "en").slice(0,2);
  return SUPPORTED.includes(nav) ? nav : "en";
}
function t(key){ return (I18N[state.lang] && I18N[state.lang][key]) || I18N.en[key] || key; }

function applyLangToDom(){
  document.documentElement.lang = state.lang;
  document.documentElement.dir = I18N[state.lang].dir;
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    el.textContent = t(el.getAttribute("data-i18n"));
  });
}

function renderContent(){
  const el = document.getElementById("content");

  if (state.needsLocation) {
    el.innerHTML = `
      <div class="glass">
        <h2 style="margin-top:0;">${t('location_permission_title')}</h2>
        <p class="muted">${t('location_permission_body')}</p>
        <button class="primary" id="btnGrant">${t('location_permission_grant')}</button>
      </div>`;
    document.getElementById("btnGrant").onclick = requestLocationAndFetch;
    return;
  }

  if (state.loading) {
    el.innerHTML = `<div class="glass" style="display:flex;align-items:center;"><span class="loader"></span> ${t('loading_weather')}</div>`;
    return;
  }

  if (state.error) {
    el.innerHTML = `
      <div class="glass">
        <p>${state.error}</p>
        <button class="primary" id="btnRetry">${t('retry')}</button>
      </div>`;
    document.getElementById("btnRetry").onclick = requestLocationAndFetch;
    return;
  }

  const w = state.weather;
  let html = "";

  if (w.isStorm) {
    html += `<div class="glass alert-row"><span class="dot"></span><span>${t('alert_storm_incoming')}</span></div>`;
  }

  html += `
    <div class="glass">
      <p class="city">${w.city}</p>
      <p class="temp">${w.temp}°</p>
      <p class="desc">${w.desc}</p>
      <p class="feels">${t('feels_like')} ${w.feelsLike}°</p>
    </div>
    <div class="glass">
      <div class="stats-row">
        <div class="stat"><b>${w.humidity}%</b><span>${t('humidity')}</span></div>
        <div class="stat"><b>${w.wind} m/s</b><span>${t('wind')}</span></div>
        <div class="stat"><b>${w.pop}%</b><span>${t('rain_chance')}</span></div>
      </div>
    </div>`;

  if (w.daily && w.daily.length) {
    html += `<div class="glass"><p class="muted" style="margin:0 0 10px;">${t('forecast_days')}</p><div class="forecast-row">`;
    w.daily.forEach(day => {
      html += `
        <div class="forecast-day">
          <span class="fc-label">${day.label}</span>
          <span class="fc-pop">${day.pop}%</span>
          <span class="fc-temp">${day.max}° / ${day.min}°</span>
        </div>`;
    });
    html += `</div></div>`;
  }

  if (!w.isStorm) {
    html += `<div class="glass muted">${t('no_active_alerts')}</div>`;
  }

  el.innerHTML = html;
  setStormVisuals(w.isStorm);
}

/* ===================== Efectos visuales de tormenta ===================== */
let rainBuilt = false;
let lightningInterval = null;

function buildRainDrops(){
  if (rainBuilt) return;
  const layer = document.getElementById("rainLayer");
  const dropCount = 70;
  const frag = document.createDocumentFragment();
  for (let i = 0; i < dropCount; i++){
    const d = document.createElement("div");
    d.className = "drop";
    const left = Math.random() * 110 - 5; // % , un poco fuera de los bordes por la rotación
    const duration = 0.7 + Math.random() * 0.6; // segundos: velocidad distinta por gota
    const delay = Math.random() * 2;
    const height = 40 + Math.random() * 40;
    d.style.left = left + "%";
    d.style.height = height + "px";
    d.style.animationDuration = duration + "s";
    d.style.animationDelay = delay + "s";
    frag.appendChild(d);
  }
  layer.appendChild(frag);
  rainBuilt = true;
}

function setStormVisuals(isStorm){
  const rain = document.getElementById("rainLayer");
  const bg = document.getElementById("stormBg");

  if (isStorm) {
    buildRainDrops();
    rain.classList.add("active");
    bg.classList.add("storm-mode");
    if (!lightningInterval) {
      triggerLightning(); // un primer destello al activarse
      lightningInterval = setInterval(triggerLightning, 6000 + Math.random() * 5000);
    }
  } else {
    rain.classList.remove("active");
    bg.classList.remove("storm-mode");
    if (lightningInterval) { clearInterval(lightningInterval); lightningInterval = null; }
  }
}

function triggerLightning(){
  const flash = document.getElementById("lightningFlash");
  flash.classList.remove("flash");
  // truco para poder relanzar la misma animación CSS varias veces seguidas
  void flash.offsetWidth;
  flash.classList.add("flash");
}

function renderLangList(){
  const wrap = document.getElementById("langList");
  const names = {es:"Español", en:"English", ar:"العربية", zh:"简体中文"};
  wrap.innerHTML = SUPPORTED.map(code => `
    <label class="lang-option">
      <input type="radio" name="lang" value="${code}" ${state.lang===code?"checked":""}>
      <span>${names[code]}</span>
    </label>`).join("");
  wrap.querySelectorAll("input[name=lang]").forEach(inp=>{
    inp.addEventListener("change", e=>{
      state.lang = e.target.value;
      localStorage.setItem("sw_lang", state.lang);
      applyLangToDom();
      document.querySelector('[data-i18n="privacy_policy_body"]').textContent = t('privacy_policy_body');
      renderContent();
    });
  });
}

function requestLocationAndFetch(){
  state.needsLocation = false;
  state.loading = true;
  state.error = null;
  renderContent();

  if (!navigator.geolocation) {
    state.loading = false;
    state.error = t('error_generic');
    renderContent();
    return;
  }

  navigator.geolocation.getCurrentPosition(
    pos => {
      state.lat = pos.coords.latitude;
      state.lon = pos.coords.longitude;
      fetchWeather(pos.coords.latitude, pos.coords.longitude);
    },
    () => { state.loading = false; state.needsLocation = true; renderContent(); },
    { enableHighAccuracy:false, timeout:10000 }
  );
}

/**
 * Agrupa los tramos de 3 horas que devuelve /forecast (5 días) en un resumen
 * de un bloque por día: temperatura máx/mín y la mayor probabilidad de lluvia
 * detectada ese día. Se salta el día de hoy (ya se muestra arriba como "ahora")
 * y devuelve los siguientes 4 días.
 */
function buildDailyForecast(fc){
  if (!fc || !fc.list) return [];
  const owmLocale = state.lang === "zh" ? "zh-CN" : state.lang === "ar" ? "ar" : state.lang === "en" ? "en-US" : "es-ES";
  const todayKey = new Date().toDateString();
  const byDay = {};

  fc.list.forEach(entry => {
    const d = new Date(entry.dt * 1000);
    const key = d.toDateString();
    if (key === todayKey) return; // hoy ya se muestra en la tarjeta principal
    if (!byDay[key]) byDay[key] = { date: d, min: entry.main.temp_min, max: entry.main.temp_max, pop: 0, icon: entry.weather[0] ? entry.weather[0].icon : "01d" };
    const day = byDay[key];
    day.min = Math.min(day.min, entry.main.temp_min);
    day.max = Math.max(day.max, entry.main.temp_max);
    day.pop = Math.max(day.pop, Math.round((entry.pop || 0) * 100));
    // Nos quedamos con el icono del tramo del mediodía como representativo del día
    if (d.getHours() >= 11 && d.getHours() <= 14) day.icon = entry.weather[0] ? entry.weather[0].icon : day.icon;
  });

  return Object.values(byDay).slice(0, 4).map(day => ({
    label: new Intl.DateTimeFormat(owmLocale, { weekday: 'short' }).format(day.date),
    min: Math.round(day.min),
    max: Math.round(day.max),
    pop: day.pop
  }));
}

async function fetchWeather(lat, lon){
  if (!state.apiKey) {
    state.loading = false;
    state.error = t('need_apikey');
    renderContent();
    return;
  }
  const owmLang = state.lang === "zh" ? "zh_cn" : state.lang;
  const base = "https://api.openweathermap.org/data/2.5";
  try {
    const [curRes, fcRes] = await Promise.all([
      fetch(`${base}/weather?lat=${lat}&lon=${lon}&appid=${state.apiKey}&units=metric&lang=${owmLang}`),
      fetch(`${base}/forecast?lat=${lat}&lon=${lon}&appid=${state.apiKey}&units=metric&lang=${owmLang}`)
    ]);
    if (!curRes.ok) throw new Error("api_error");
    const cur = await curRes.json();
    const fc = fcRes.ok ? await fcRes.json() : null;

    const pop = fc && fc.list && fc.list[0] ? Math.round((fc.list[0].pop || 0) * 100) : 0;
    const weatherId = cur.weather && cur.weather[0] ? cur.weather[0].id : 800;
    const isThunder = weatherId >= 200 && weatherId <= 232;
    const isStorm = isThunder || pop >= 60;

    state.weather = {
      city: cur.name || "",
      temp: Math.round(cur.main.temp),
      feelsLike: Math.round(cur.main.feels_like),
      humidity: cur.main.humidity,
      wind: cur.wind ? cur.wind.speed : 0,
      desc: cur.weather && cur.weather[0] ? cur.weather[0].description : "",
      pop, isStorm,
      daily: buildDailyForecast(fc)
    };
    state.loading = false;
    state.error = null;
    renderContent();
    if (isStorm && state.notif) maybeNotify();
  } catch(e) {
    state.loading = false;
    state.error = t('error_generic');
    renderContent();
  }
}

function maybeNotify(){
  if (!("Notification" in window)) return;
  if (Notification.permission === "granted") {
    new Notification(t('alert_storm_incoming'));
  } else if (Notification.permission !== "denied") {
    Notification.requestPermission();
  }
}

document.getElementById("btnSettings").onclick = () => {
  document.getElementById("apiKeyInput").value = state.apiKey;
  document.getElementById("notifToggle").checked = state.notif;
  document.getElementById("settingsOverlay").classList.add("open");
};
document.getElementById("closeSettings").onclick = () => document.getElementById("settingsOverlay").classList.remove("open");
document.getElementById("notifToggle").onchange = e => {
  state.notif = e.target.checked;
  localStorage.setItem("sw_notif", state.notif ? "1" : "0");
  if (state.notif && "Notification" in window && Notification.permission === "default") Notification.requestPermission();
};
document.getElementById("apiKeyInput").addEventListener("change", e => {
  state.apiKey = e.target.value.trim();
  localStorage.setItem("sw_apikey", state.apiKey);
  if (state.apiKey && !state.needsLocation) requestLocationAndFetch();
});
document.getElementById("btnPrivacy").onclick = () => document.getElementById("privacyOverlay").classList.add("open");
document.getElementById("closePrivacy").onclick = () => document.getElementById("privacyOverlay").classList.remove("open");

/* ===================== Radar de lluvia en directo ===================== */
let radarMapInstance = null;

function openRadar(){
  if (state.lat == null || state.lon == null) {
    alert(t('radar_needs_location'));
    return;
  }
  document.getElementById("radarOverlay").classList.add("open");

  // Leaflet necesita que el contenedor ya sea visible antes de inicializarse (o recalcular tamaño),
  // por eso esperamos un instante tras mostrar el overlay.
  setTimeout(() => {
    if (!radarMapInstance) {
      radarMapInstance = L.map('radarMap', { attributionControl: true }).setView([state.lat, state.lon], 7);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap',
        maxZoom: 12
      }).addTo(radarMapInstance);

      // Capa de precipitación en casi-tiempo-real de OpenWeatherMap (misma clave ya usada en toda la app).
      L.tileLayer(`https://tile.openweathermap.org/map/precipitation_new/{z}/{x}/{y}.png?appid=${state.apiKey}`, {
        attribution: 'Precipitation © OpenWeatherMap',
        opacity: 0.75,
        maxZoom: 12
      }).addTo(radarMapInstance);

      L.marker([state.lat, state.lon]).addTo(radarMapInstance);
    } else {
      radarMapInstance.setView([state.lat, state.lon], 7);
    }
    radarMapInstance.invalidateSize();
  }, 150);
}

function closeRadar(){
  document.getElementById("radarOverlay").classList.remove("open");
}

document.getElementById("btnRadar").onclick = openRadar;
document.getElementById("closeRadar").onclick = closeRadar;

function init(){
  applyLangToDom();
  renderLangList();
  document.querySelector('[data-i18n="privacy_policy_body"]').textContent = t('privacy_policy_body');
  requestLocationAndFetch();
  // Destello de bienvenida sutil: da vida a la escena desde el primer segundo,
  // independientemente de si hay tormenta real o no.
  setTimeout(triggerLightning, 900);
}
init();
</script>
